name: Deploy protected GitHub Pages site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build-Abhängigkeiten installieren
        run: npm ci

      - name: Passwortgeschützte Website erzeugen
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: bash scripts/build-protected-site.sh

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Deployment-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: protected

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
