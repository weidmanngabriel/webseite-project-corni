<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webseite Project Corni</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7fb;
        color: #1f2937;
      }

      main {
        width: min(90%, 720px);
        padding: 3rem;
        text-align: center;
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 1rem 3rem rgb(15 23 42 / 12%);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }

      p {
        margin: 0;
        font-size: 1.125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Willkommen!</h1>
      <p>Diese einfache Startseite zeigt, dass die Webseite erfolgreich bereitgestellt wurde.</p>
    </main>
  </body>
</html>
